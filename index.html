<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twofold</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f1fa;--s1:#fff;--s2:#e8e7f6;--tx:#1b1936;--mu:#6a678c;--ln:rgba(27,25,54,.09);--sh:rgba(80,70,180,.16);--p1:#6b7bff;--p2:#ff9f43;--on1:#fff;--on2:#2a1500;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111f;--s1:#1c1b2e;--s2:#27263f;--tx:#f1efff;--mu:#a09dc4;--ln:rgba(255,255,255,.08);--sh:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#12111f;--s1:#1c1b2e;--s2:#27263f;--tx:#f1efff;--mu:#a09dc4;--ln:rgba(255,255,255,.08);--sh:rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 "Instrument Sans",system-ui,sans-serif;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--p1);outline-offset:3px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px;font:600 19px "Unbounded",sans-serif}
.pair{position:relative;width:38px;height:26px;flex:none}
.pair i{position:absolute;top:0;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--bg);display:grid;place-items:center;font:600 11px "Unbounded",sans-serif;font-style:normal}
.pair i:first-child{left:0;background:var(--p1);color:var(--on1)}
.pair i:last-child{left:13px;background:var(--p2);color:var(--on2)}
h1{font:500 24px/1.2 "Unbounded",sans-serif;margin-bottom:6px;letter-spacing:-.01em}
.sub{color:var(--mu);margin-bottom:20px}
h2{font:600 16px "Unbounded",sans-serif;margin:28px 2px 12px}
.hero{position:relative;height:226px;border-radius:30px;overflow:hidden;background:var(--p1);box-shadow:0 18px 40px -16px var(--sh)}
.bgR{position:absolute;inset:0;background:var(--p2);clip-path:polygon(56% 0,100% 0,100% 100%,44% 100%);animation:wipe 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes wipe{from{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}}
.half{position:absolute;top:0;bottom:0;width:50%;padding:18px 20px 64px;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.l{left:0;color:var(--on1)}
.r{right:0;align-items:flex-end;color:var(--on2)}
.who{font-weight:600;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12.5px;opacity:.85}
.big{font:600 60px/1 "Unbounded",sans-serif;letter-spacing:-.03em}
.go{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;background:var(--bg);color:var(--tx);font-weight:600;box-shadow:0 8px 20px -6px rgba(0,0,0,.35);transition:transform .15s}
.go:active{transform:translateX(-50%) scale(.95)}
.go svg{width:16px;height:16px;fill:currentColor;stroke:none}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:16px;box-shadow:0 10px 30px -18px var(--sh)}
.life{margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.num{font:600 28px "Unbounded",sans-serif;letter-spacing:-.02em}
.nm{display:flex;align-items:center;gap:7px;color:var(--mu);font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.bar{display:flex;gap:4px;height:10px;margin-top:12px}
.bar i{border-radius:99px;transition:flex .5s cubic-bezier(.2,.8,.2,1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{text-align:left;display:flex;flex-direction:column;gap:12px;background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:14px;box-shadow:0 10px 30px -18px var(--sh);transition:transform .18s cubic-bezier(.3,1.5,.5,1),border-color .2s}
.game:active{transform:scale(.96)}
.game:hover{border-color:var(--mu)}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center}
.ic svg,.tab svg,.med svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.game b{font:500 15px "Unbounded",sans-serif;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--s2);border-radius:99px;padding:2px 9px;font-size:12px;color:var(--mu)}
.lead{display:flex;gap:3px;height:5px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.sec h2{margin:0}
.sec button{color:var(--mu);font-size:13.5px;padding:6px 4px}
.rail{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{flex:none;width:108px;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.tile.wide{width:252px}
.tile:active{transform:scale(.96)}
.th{position:relative;aspect-ratio:1;border-radius:22px;display:grid;place-items:center;box-shadow:0 12px 26px -14px var(--sh)}
.wide .th{aspect-ratio:16/9}
.cir{width:56px;height:56px;border-radius:50%;background:var(--bg);color:var(--tx);display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(0,0,0,.4)}
.cir svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill{position:absolute;top:10px;right:10px;background:var(--bg);color:var(--tx);font:600 12px "Unbounded",sans-serif;padding:4px 10px;border-radius:99px}
.tile b{font-weight:600;font-size:14.5px;padding:0 2px}
.meta{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mu);padding:0 2px}
.meta .chip{margin-left:auto}
.mode{width:fit-content;margin-bottom:20px}
.mode button{padding:8px 16px}
.empty{color:var(--mu);text-align:center;padding:18px 6px}
.ring{position:absolute;top:16px;left:50%;margin-left:-42px;width:84px;height:84px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:2;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring b{font:600 16px "Unbounded",sans-serif}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.15)}}
.solo .go{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 8px 26px -2px var(--p1)}}
.xp{height:10px;border-radius:99px;background:var(--s2);margin-top:12px;overflow:hidden}
.xp i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p1),var(--p2))}
#view.out>:not(.mode){animation:vout .2s ease-in both}
#view.in>:not(.mode){animation:vin .5s cubic-bezier(.2,.9,.2,1) both}
#view.in>:nth-child(3){animation-delay:.05s}
#view.in>:nth-child(n+4){animation-delay:.1s}
@keyframes vout{to{opacity:0;transform:translateX(calc(var(--d)*-44px)) scale(.96)}}
@keyframes vin{from{opacity:0;transform:translateX(calc(var(--d)*44px)) scale(.96)}}
.streakbox{position:relative;width:84px;height:92px;display:grid;place-items:center}
.solo .streakbox{animation:ignite .6s cubic-bezier(.3,1.6,.5,1) .5s both}
@keyframes ignite{from{opacity:0;transform:scale(.5) translateY(14px)}}
.flame{position:absolute;bottom:6px;left:50%;width:64px;height:80px;margin-left:-32px;transform-origin:50% 100%;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px #ff2e63);animation:flick 1.6s ease-in-out infinite,glowp 2.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(1.04,.97) rotate(-1.5deg)}50%{transform:scale(.97,1.05) rotate(1deg)}75%{transform:scale(1.03,.99) rotate(-.5deg)}}
@keyframes glowp{50%{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 22px #ff2e63)}}
.streakbox b{position:relative;margin-top:14px;font:600 34px/1 "Unbounded",sans-serif;color:#6b0a2a;text-shadow:0 0 8px rgba(255,255,255,.7)}
.lead i{border-radius:9px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.list .item:first-child{border-top:0}
.item .ic{width:40px;height:40px;border-radius:13px}
.item div{flex:1;min-width:0}
.item small{color:var(--mu);display:block}
.win{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px}
.hd{text-align:center;padding:24px 16px}
.hd .num{font-size:52px}
.hd .row{justify-content:center;gap:22px;align-items:center}
.streak{display:flex;gap:6px;margin-top:10px}
.streak i{width:12px;height:12px;border-radius:50%}
.meds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.med{text-align:center;font-size:13px}
.med .disc{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--p1),var(--p2),var(--p1));padding:3px}
.med .disc span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--s1)}
.med.lock .disc{background:var(--s2)}
.med.lock .disc span{background:var(--bg);color:var(--mu)}
.med.lock{color:var(--mu)}
.med svg{width:28px;height:28px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--ln)}
.set:first-child{border-top:0}
.set small{display:block;color:var(--mu)}
.seg{display:flex;background:var(--s2);border-radius:99px;padding:3px}
.seg button{padding:6px 13px;border-radius:99px;font-size:13.5px;color:var(--mu)}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 2px 8px -2px var(--sh)}
.sw{width:48px;height:28px;border-radius:99px;background:var(--s2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked=true]{background:var(--p1)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.field{width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg)}
.field:focus{outline:2px solid var(--p1);border-color:transparent}
.sws{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.sws button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);transition:transform .15s}
.sws button[aria-pressed=true]{outline:3px solid var(--tx);outline-offset:2px;transform:scale(1.08)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border:1px solid var(--ln);border-radius:99px;padding:5px;box-shadow:0 16px 40px -10px var(--sh);z-index:5}
.ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:99px;background:linear-gradient(115deg,color-mix(in srgb,var(--p1) 30%,var(--s1)) 50%,color-mix(in srgb,var(--p2) 30%,var(--s1)) 50%);transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11.5px;color:var(--mu);transition:color .2s}
.tab[aria-current=page]{color:var(--tx);font-weight:600}
.tab svg{width:21px;height:21px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;transition:.3s;z-index:6;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding:10px 16px 12px;margin:0 -16px 4px;background:var(--bg);border-bottom:1px solid var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.menu{width:46px;height:46px;border-radius:15px;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center;flex:none}
.menu svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.top .seg{flex:1;max-width:220px}
.top .seg button{flex:1;padding:11px 0;font-weight:600}
.topstat{margin-left:auto;display:flex;align-items:center;gap:6px;font:600 15px "Unbounded",sans-serif;min-width:64px;justify-content:flex-end}
.fireN{position:relative;width:44px;height:52px;display:grid;place-items:center}
.fireN .flame{width:44px;height:54px;margin-left:-22px;bottom:-2px;object-fit:contain;animation:none;filter:none}
.fireN b{position:relative;margin-top:17px;font:600 16px "Unbounded",sans-serif;color:#05203d;text-shadow:0 0 6px rgba(255,255,255,.75)}
.tile:not(.wide) .meta .chip{display:none}
#scrim{position:fixed;inset:0;background:rgba(10,8,24,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:15}
#scrim.on{opacity:1;pointer-events:auto}
nav{left:0;top:0;bottom:0;width:min(300px,84vw);transform:translateX(-105%);border-radius:0 28px 28px 0;grid-template-columns:1fr;grid-auto-rows:52px;gap:4px;align-content:start;padding:calc(72px + env(safe-area-inset-top,0px)) 12px 12px;box-shadow:none;transition:transform .38s cubic-bezier(.2,.9,.2,1),box-shadow .3s;z-index:20}
nav.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.45)}
nav .ind{top:calc(72px + env(safe-area-inset-top,0px));left:12px;right:12px;bottom:auto;width:auto;height:52px}
nav .tab{flex-direction:row;justify-content:flex-start;gap:14px;padding:0 18px;height:52px;font-size:15.5px}
.dlogo{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:24px}
.dlogo .pair i{border-color:var(--s1)}
#world{position:fixed;inset:0;z-index:40;background:#bfe3ff;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#world[hidden]{display:none}

#world canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.wbtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;padding:10px 16px;border-radius:99px;background:rgba(18,17,31,.72);color:#fff;font-weight:600;backdrop-filter:blur(8px)}
.wtitle{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:#fff;font:600 14px "Unbounded",sans-serif;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#joy{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);touch-action:none;pointer-events:none;transition:opacity .35s}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(0,0,0,.25)}
#jump{position:absolute;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(52px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.65);color:#fff;font:600 13px "Unbounded",sans-serif;touch-action:none}
#jump:active{background:rgba(255,255,255,.55)}
#joy.fade{opacity:0}
#crouch{position:absolute;right:calc(128px + env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.65);color:#fff;font:600 10px "Unbounded",sans-serif;touch-action:none}
#crouch.on{background:rgba(255,255,255,.65);color:#1b1936}
#exitC{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(10,8,24,.55);backdrop-filter:blur(4px)}
#exitC[hidden]{display:none}
.xcard{background:var(--s1);color:var(--tx);border-radius:24px;padding:22px 22px 18px;width:min(86vw,320px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.xcard h3{font:600 20px "Unbounded",sans-serif;margin-bottom:6px}
.xcard p{color:var(--mu);margin-bottom:16px}
.xcard .row2{display:flex;gap:10px}
.xcard button{flex:1;padding:13px;border-radius:99px;font-weight:600;background:var(--s2);color:var(--tx)}
.xcard button.y{background:var(--p1);color:var(--on1)}
#mpBtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;padding:10px 16px;border-radius:99px;background:rgba(18,17,31,.72);color:#fff;font-weight:600;backdrop-filter:blur(8px)}
#setPanel{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(10,8,24,.55);backdrop-filter:blur(4px)}
#setPanel[hidden]{display:none}
#setPanel .row2{margin-bottom:8px}
#mpCode{font:600 34px "Unbounded",sans-serif;letter-spacing:.12em;margin:0 0 12px}
#mpCode[hidden],#mpIdle[hidden],#mpIn2[hidden]{display:none}
.sethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sethead h3{margin:0!important}
.sethead button{flex:none!important;width:36px;height:36px;padding:0!important;font-size:22px;line-height:1}
.xcard .onrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 4px;border-radius:14px;background:none;text-align:left;flex:none}
.onl b{display:block;font-size:16px}
.onl small{color:var(--mu);font-weight:400;font-size:13px}
.tg{width:58px;height:34px;border-radius:99px;background:#c4c3d4;position:relative;flex:none;transition:background .35s}
.tg i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 0 0 1px rgba(0,0,0,.06);transition:left .38s cubic-bezier(.3,1.5,.5,1),width .18s}
.onrow[aria-checked=true] .tg{background:#2fc846}
.onrow[aria-checked=true] .tg i{left:27px}
.onrow:active .tg i{width:36px}
.onrow[aria-checked=true]:active .tg i{left:19px}
.onrow.pulse .tg{animation:tgOn .65s ease-out}
@keyframes tgOn{0%{box-shadow:0 0 0 0 rgba(47,200,70,.55)}100%{box-shadow:0 0 0 14px rgba(47,200,70,0)}}
#mpBody{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .4s,visibility 0s .4s}
#mpBody.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .4s}
#mpBody>div{overflow:hidden;min-height:0}
.xcard button.ex{background:rgba(224,64,90,.16);color:#e0405a}
#wExit{width:46px;height:46px;padding:0;display:grid;place-items:center}
#wExit svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;transition:transform .5s}
#wExit:active svg{transform:rotate(60deg)}
.mpin{width:100%;padding:12px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);text-align:center;font:600 18px "Unbounded",sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:4px 0 8px}
.hc{position:relative;height:176px;margin:10px 0 4px;border-radius:30px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--p1) 22%,var(--s1)),var(--s1));border:1px solid var(--ln);box-shadow:0 14px 34px -18px var(--sh)}
.hc canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><button class="menu" id="menuBtn" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><div class="seg" id="modeSeg" role="group" aria-label="Mode"></div><div class="topstat" id="topStat"></div></header>
  <main id="view"></main>
</div>
<div id="toast" role="status"></div>
<div id="scrim"></div>
<nav aria-label="Main" id="drawer">
  <div class="logo dlogo"><span class="pair"><i data-i="1"></i><i data-i="2"></i></span>Twofold</div>
  <span class="ind" id="ind"></span>
</nav>
<script>
const $=s=>document.querySelector(s), root=document.documentElement;
const P={
 play:'<path d="M8 5.5v13l10-6.5z"/>',
 rival:'<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>',
 cup:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M8 20h8"/>',
 set:'<path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/>',
 tug:'<path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>',
 bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
 clock:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9.5 2.5h5"/>',
 aim:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
 mem:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
 dots:'<circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const GAMES=[
 {k:'tug',t:'Tug',c:'30 sec',l:[6,4]},{k:'bolt',t:'Reflex',c:'1 min',l:[3,5]},
 {k:'clock',t:'Stop at 5',c:'1 min',l:[4,4]},{k:'aim',t:'Duel',c:'2 min',l:[2,6]},
 {k:'mem',t:'Memory',c:'3 min',l:[5,2]},{k:'dots',t:'Dots',c:'5 min',l:[1,1]}];
const modeBar=()=>''&&`<div class="seg mode" role="group" aria-label="Mode">${[['duo','Two players'],['solo','Solo']].map(([v,l])=>`<button data-act="mode" data-v="${v}" class="${st.mode===v?'on':''}">${l}</button>`).join('')}</div>`;
const solo=()=>`<h1>${greet}, ${nm(1)}</h1><p class="sub">Beat your own best.</p>
<section class="hero solo" aria-label="Your level"><div class="bgR"></div>
 <div class="half l"><div class="who">Level</div><div class="big">1</div></div>
 <div class="half r"><div class="who">Day streak</div><div class="streakbox"><svg class="flame" viewBox="0 0 64 80" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff1f5a"/></linearGradient></defs><path d="M34 3c2 14 20 22 20 44a22 22 0 0 1-44 0c0-12 7-20 12-27 1 7 4 10 8 11-1-10-1-20 4-28z" fill="url(#fg)" fill-opacity=".92" stroke="#fff" stroke-opacity=".9" stroke-width="2.4" stroke-linejoin="round"/><path d="M32 34c1 8 10 12 10 22a10 10 0 0 1-20 0c0-6 4-9 6-13 1 3 2 4 4 4-1-5-1-9 0-13z" fill="#fff7c2" fill-opacity=".95" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><b>0</b></div></div>
 <div class="ring" id="ring"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="35" fill="none" stroke="var(--s2)" stroke-width="7" stroke-linecap="round" stroke-dasharray="63 10.3"/></svg><b>0/3</b></div>
 <button class="go" data-act="solo"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>Play solo</button></section>
<section class="card life"><div class="row"><div><b>Today's goal</b><small class="nm" style="display:block">Play 3 rounds to earn 50 XP</small></div><div class="num">0/3</div></div><div class="xp" aria-hidden="true"><i></i></div></section>${rows()}`;
const progress=()=>modeBar()+`<h1>Progress</h1><p class="sub">Your solo journey, one round at a time.</p><div class="grid">${[['1','Level'],['0','Day streak'],['0','Rounds played'],['0','Total XP']].map(([n,l])=>`<section class="card"><div class="num">${n}</div><div class="nm">${l}</div></section>`).join('')}</div><h2>Personal bests</h2><section class="card list"><p class="empty">Play a solo round and your best scores will show up here.</p></section>`;
const CAT=GAMES.concat([{k:'tug',t:'Thumb War',c:'30 sec',l:[3,2]},{k:'bolt',t:'Hot Wire',c:'1 min',l:[2,2]},{k:'aim',t:'Pong Duel',c:'2 min',l:[4,3]},{k:'mem',t:'Color Match',c:'2 min',l:[1,3]},{k:'tug',t:'Sumo Slide',c:'1 min',l:[0,1]},{k:'dots',t:'Beat Tap',c:'1 min',l:[2,0]},{k:'mem',t:'Word Vault',c:'3 min',l:[0,0]},{k:'aim',t:'Spell Gates',c:'5 min',l:[0,0]},{k:'bolt',t:'Pixel Runner',c:'2 min',l:[0,0]},{k:'dots',t:'Sky Hop',c:'1 min',l:[0,0]},{k:'aim',t:'Baseplate',c:'Open world',l:[0,0]},{k:'tug',t:'Cave Escape',c:'5 min',l:[0,0]},{k:'mem',t:'Block Stack',c:'2 min',l:[0,0]},{k:'dots',t:'Number Chain',c:'2 min',l:[0,0]},{k:'clock',t:'Bomb Defuse',c:'1 min',l:[0,0]},{k:'mem',t:'Pixel Painter',c:'4 min',l:[0,0]}]);
const ROWS=[['Start here',[0,1,2],1],['Quick rounds',[1,0,2,6,9,11],0],['Brain games',[4,5,3,8,10],0],['New this week',[6,7,8,9,10,11],0]];
const tile=(i,w)=>{const g={...CAT[i],l:[0,0]},a=i%2+1,b=3-a;return `<button class="tile${w?' wide':''}" data-act="game" data-t="${g.t}"><span class="th" style="background:${st.mode==='solo'?`linear-gradient(${[135,160,200,115][i%4]}deg,var(--p1),color-mix(in srgb,var(--p1) 40%,#12111f))`:`linear-gradient(${[135,160,200,115][i%4]}deg,var(--p${a}) 50%,var(--p${b}) 50%)`}"><span class="cir">${svg(g.k)}</span>${w&&st.mode!=='solo'?`<span class="pill">${g.l[0]}–${g.l[1]}</span>`:''}</span><b>${g.t}</b><span class="meta">${st.mode==='solo'?'<span>No best yet</span>':`<i class="dot" style="background:var(--p1)"></i>${g.l[0]}<i class="dot" style="background:var(--p2)"></i>${g.l[1]}`}<span class="chip">${g.c}</span></span></button>`};
const rows=()=>(st.mode==='solo'?[['Daily challenge',[1,0,2],1],...ROWS.slice(1)]:ROWS).map(([t,ids,w])=>`<div class="sec"><h2>${t}</h2><button data-act="game" data-t="The full list">See all</button></div><div class="rail">${ids.map(i=>tile(i,w)).join('')}</div>`).join('');
const RECENT=[];const OLD_RECENT=[[1,1,'3–1','2h ago'],[3,2,'3–2','Yesterday'],[0,2,'3–0','Yesterday'],[4,1,'3–2','Mon'],[5,2,'3–1','Sun']];
const BADGES=[['First win',0],['Hat trick',0],['Comeback',0],['Perfect 5.00',0],['Ten in a row',0],['Night owl',0]];
const TABS=[['play','Play'],['rival','Rivalry'],['cup','Trophies'],['set','Settings']];
const SW1=['#6b7bff','#38bdf8','#34d399','#c084fc','#f472b6'],SW2=['#ff9f43','#fb7185','#facc15','#a3e635','#f97316'];
let st={mode:'duo',n1:'Alex',n2:'Sam',c1:SW1[0],c2:SW2[0],theme:'auto',sound:true,haptics:true},tab=0;
try{Object.assign(st,JSON.parse(localStorage.getItem('twofold')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('twofold',JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
const onC=h=>lum(h)>.32?'#1b1100':'#ffffff';
const ini=n=>(n.trim()[0]||'?').toUpperCase();
function theme(){
  if(st.theme==='auto')delete root.dataset.theme;else root.dataset.theme=st.theme;
  root.style.setProperty('--p1',st.c1);root.style.setProperty('--p2',st.c2);
  root.style.setProperty('--on1',onC(st.c1));root.style.setProperty('--on2',onC(st.c2));
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=ini(st['n'+e.dataset.i]));
}
const hour=new Date().getHours(),greet=hour<5?'Late night':hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
const nm=n=>`<span data-n="${n}">${esc(st['n'+n])}</span>`;
const WINS=[0,0];
const lifeBar=(a,b)=>(a=WINS[0],b=WINS[1],!a&&!b)?`<div class="bar" style="opacity:.35"><i style="flex:1;background:var(--p1)"></i><i style="flex:1;background:var(--p2)"></i></div>`:`<div class="bar"><i style="flex:${a};background:var(--p1)"></i><i style="flex:${b};background:var(--p2)"></i></div>`;

const VIEWS=[
()=>home()||(st.mode==='solo'?solo():`<h1>${greet}, ${nm(1)} and ${nm(2)}</h1><p class="sub">Two players, one phone.</p>
<section class="hero" aria-label="Tonight's score"><div class="bgR"></div>
 <div class="half l"><div><div class="who" data-n="1">${esc(st.n1)}</div><div class="tag">Tonight</div></div><div class="big">0</div></div>
 <div class="half r"><div style="text-align:right"><div class="who" data-n="2">${esc(st.n2)}</div><div class="tag">Tonight</div></div><div class="big">0</div></div>
 <button class="go" data-act="match"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>Quick match</button></section>
<section class="card life"><div class="row"><div><div class="num">${WINS[0]}</div><div class="nm"><i class="dot" style="background:var(--p1)"></i>${nm(1)}</div></div>
 <div style="text-align:right"><div class="num">${WINS[1]}</div><div class="nm" style="justify-content:flex-end"><i class="dot" style="background:var(--p2)"></i>${nm(2)}</div></div></div>${lifeBar(14,11)}</section>
${rows()}`),
()=>st.mode==='solo'?progress():modeBar()+`<h1>Rivalry</h1><p class="sub">Every match you have played, side by side.</p>
<section class="card hd"><div class="row"><div><div class="num">${WINS[0]}</div><div class="nm"><i class="dot" style="background:var(--p1)"></i>${nm(1)}</div></div><div class="nm">wins</div><div><div class="num">${WINS[1]}</div><div class="nm"><i class="dot" style="background:var(--p2)"></i>${nm(2)}</div></div></div>${lifeBar(14,11)}</section>
<section class="card life"><div class="row"><div><b>No streak yet</b><small class="nm" style="display:block">Win two in a row to start one</small></div><div class="streak"><i style="background:var(--s2)"></i><i style="background:var(--s2)"></i><i style="background:var(--s2)"></i></div></div></section>
<h2>Recent matches</h2><section class="card list">${RECENT.length?'':'<p class="empty">No matches yet. Your first one will show up here.</p>'}${RECENT.map(([g,w,s,t])=>`<div class="item"><span class="ic" style="background:var(--s2)">${svg(GAMES[g].k)}</span><div><b>${GAMES[g].t}</b><small>${t}</small></div><span class="win" style="background:var(--p${w+1});color:var(--on${w+1})">${s}</span></div>`).join('')}</section>`,
()=>`<h1>Trophies</h1><p class="sub">Earned together, kept together.</p><section class="card"><div class="meds">${BADGES.map(([n,o])=>`<div class="med ${o?'':'lock'}"><div class="disc"><span>${svg(o?'cup':'lock')}</span></div>${n}</div>`).join('')}</div></section>`,
()=>`<h1>Settings</h1><p class="sub">Make it feel like yours.</p>
<section class="card"><div class="set"><div>Appearance</div><div class="seg">${['auto','light','dark'].map(t=>`<button data-act="theme" data-v="${t}" class="${st.theme===t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
<div class="set"><div>Sound<small>Soft clicks and chimes</small></div><button class="sw" role="switch" aria-label="Sound" aria-checked="${st.sound}" data-act="sw" data-v="sound"></button></div>
<div class="set"><div>Haptics<small>A tap you can feel</small></div><button class="sw" role="switch" aria-label="Haptics" aria-checked="${st.haptics}" data-act="sw" data-v="haptics"></button></div></section>
${[1,2].map(n=>`<h2>Player ${n}</h2><section class="card"><label for="in${n}">Name</label><input class="field" id="in${n}" maxlength="14" value="${esc(st['n'+n])}" data-n-in="${n}" autocomplete="off">
<div class="sws" role="group" aria-label="Player ${n} color">${(n===1?SW1:SW2).map(c=>`<button data-act="col" data-n="${n}" data-v="${c}" style="background:${c}" aria-label="Color ${c}" aria-pressed="${st['c'+n]===c}"></button>`).join('')}</div></section>`).join('')}`
];
const nav=$('nav'),ind=$('#ind');
TABS.forEach(([k,l],i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML=svg(k)+l;b.onclick=()=>go(i);nav.appendChild(b)});
function go(i){tab=i;renderTop();closeMenu();$('#view').innerHTML=VIEWS[i]();theme();mountHero();ind.style.transform=`translateY(${i*56}px)`;
  nav.querySelectorAll('.tab').forEach((b,j)=>j===i?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));nav.querySelectorAll('.tab')[1].lastChild.textContent=st.mode==='solo'?'Progress':'Rivalry';scrollTo(0,0)}
let tt;const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)};
const buzz=()=>{if(st.haptics)try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;buzz();
  if(a==='match')toast('Quick match starts here');
  else if(a==='game'){if(b.dataset.t==='Baseplate')startWorld();else toast(b.dataset.t+' is coming soon')}
  else if(a==='mode'){const v=b.dataset.v,m=$('#view');if(v===st.mode||m.classList.contains('out'))return;m.style.setProperty('--d',v==='solo'?1:-1);st.mode=v;save();m.classList.add('out');setTimeout(()=>{go(tab);m.classList.remove('out');m.classList.add('in');setTimeout(()=>m.classList.remove('in'),700)},200)}
  else if(a==='solo'){const d=$('#ring');if(d){d.classList.remove('pop');void d.offsetWidth;d.classList.add('pop')}toast('Solo run starts here')}
  else if(a==='theme'){st.theme=b.dataset.v;save();go(tab)}
  else if(a==='sw'){st[b.dataset.v]=!st[b.dataset.v];save();b.setAttribute('aria-checked',st[b.dataset.v])}
  else if(a==='col'){st['c'+b.dataset.n]=b.dataset.v;save();go(tab)}
});
document.addEventListener('input',e=>{
  const n=e.target.dataset.nIn;if(!n)return;st['n'+n]=e.target.value.slice(0,14)||'Player '+n;save();
  document.querySelectorAll(`[data-n="${n}"]`).forEach(x=>x.textContent=st['n'+n]);theme();

  const jstart=e=>{jid=e.pointerId;jx0=e.clientX;jy0=e.clientY;clearTimeout(jtm);
    joy.style.left=(e.clientX-66)+'px';joy.style.top=(e.clientY-66)+'px';joy.style.bottom='auto';joy.classList.remove('fade');jmove(e)};
  const jfin=()=>{jid=null;W.jx=W.jy=0;W.knob.style.transform='';joy.classList.add('fade')};
  // jump
  const jb=el.querySelector('#jump');
  jb.addEventListener('pointerdown',e=>{e.preventDefault();jb.setPointerCapture(e.pointerId);W.jump=true});
  ['pointerup','pointercancel'].forEach(t=>jb.addEventListener(t,()=>W.jump=false));
  const cb=el.querySelector('#crouch');
  cb.addEventListener('pointerdown',e=>{e.preventDefault();W.cb=!W.cb;cb.classList.toggle('on',W.cb)});
  // look
  const pts=new Map();let lid=null,lx=0,ly=0,pd=0,pacc=1;
  const pdist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);
    if(e.pointerType!=='mouse'&&jid===null&&e.clientX<innerWidth*.55&&e.clientY>innerHeight*.25){jstart(e);return}
    if(e.pointerType==='mouse'&&W.fpNow&&document.pointerLockElement!==cv)lockPtr();
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){lid=e.pointerId;lx=e.clientX;ly=e.clientY}else if(pts.size===2){lid=null;pd=pdist()}});
  cv.addEventListener('pointermove',e=>{if(e.pointerId===jid){jmove(e);return}const q=pts.get(e.pointerId);if(!q)return;q.x=e.clientX;q.y=e.clientY;
    if(pts.size===2){const nd=pdist();if(pd>0&&nd>0){const ra=pd/nd;if(zt<1){pacc=ra>1?pacc*ra:1;if(pacc>1.12){zt=3.2;pacc=1}}else{const z=zt*Math.pow(ra,2);zt=z<2.2?.5:Math.min(40,z)}}pd=nd}
    else if(e.pointerId===lid){yaw-=(e.clientX-lx)*.007;pitch=Math.max(zd<1?-1.3:.08,Math.min(1.25,pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY}});
  const lend=e=>{if(e.pointerId===jid){jfin();return}pts.delete(e.pointerId);if(pts.size===1){const [id,q]=[...pts.entries()][0];lid=id;lx=q.x;ly=q.y}else if(pts.size===0)lid=null};
  cv.addEventListener('pointerup',lend);cv.addEventListener('pointercancel',lend);
  const lockPtr=()=>{try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}};
  document.addEventListener('mousemove',e=>{if(!W.run||W.paused||!W.fpNow)return;if(document.pointerLockElement!==cv&&lid!==null)return;
    yaw-=e.movementX*.0025;pitch=Math.max(-1.3,Math.min(1.25,pitch+e.movementY*.0025))});
  el.addEventListener('wheel',e=>{e.preventDefault();const dy=Math.max(-120,Math.min(120,e.deltaY));if(zt<1){if(dy>0)zt=1.8}else{const z=zt*(1+dy*.0018);zt=z<1?.5:Math.min(40,z)}},{passive:false});
  const xc=el.querySelector('#exitC');
  el.querySelector('#wExit').onclick=mpOpen;
  el.querySelector('#setExit').onclick=()=>{mpPanel.hidden=true;xc.hidden=false};
  el.querySelector('#xyes').onclick=()=>{xc.hidden=true;stopWorld()};
  el.querySelector('#xno').onclick=()=>{xc.hidden=true;W.paused=false};
  el.addEventListener('contextmenu',e=>e.preventDefault());el.addEventListener('dragstart',e=>e.preventDefault());
  const clearKeys=()=>{W.keys={};W.jx=W.jy=0;W.jump=false};
  addEventListener('blur',clearKeys);document.addEventListener('visibilitychange',clearKeys);
  addEventListener('keydown',e=>{if(!W.run)return;if(e.target&&e.target.tagName==='INPUT')return;if(e.code==='Escape'){stopWorld();return}if(/^(Key[WASDQEC]|Arrow\w+|Space)$/.test(e.code)){e.preventDefault();W.keys[e.code]=true}});
  addEventListener('keyup',e=>{delete W.keys[e.code]});
  W.ready=true;
}
let HC=null;
function mountHero(){
  if(HC){cancelAnimationFrame(HC.raf);HC.r.dispose();HC=null}
  const cv=document.getElementById('hc');if(!cv)return;
  if(typeof THREE==='undefined'){setTimeout(()=>{if(document.getElementById('hc')===cv&&!HC)mountHero()},400);return}
  const T=THREE,r=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.outputEncoding=T.sRGBEncoding;
  const sc=new T.Scene(),cam=new T.PerspectiveCamera(30,1,.1,60);
  sc.add(new T.HemisphereLight(0xdff0ff,0x6a7078,1));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(3,6,5);sc.add(dl);
  const mk=c=>new T.MeshLambertMaterial({color:c}),av=new T.Group(),skin='#ffd54a';
  const limb=(w,h,d,col,x,y)=>{const g=new T.Group(),m=new T.Mesh(new T.BoxGeometry(w,h,d),mk(col));m.position.y=-h/2;g.add(m);g.position.set(x,y,0);av.add(g);return g};
  const part=(w,h,d,col,x,y,z)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),mk(col));m.position.set(x,y,z);av.add(m)};
  const lL=limb(.55,.9,.55,'#394b8f',-.3,.9),lR=limb(.55,.9,.55,'#394b8f',.3,.9),aL=limb(.5,1.2,.5,skin,-.9,2.05),aR=limb(.5,1.2,.5,skin,.9,2.05);
  part(1.3,1.2,.7,st.c1,0,1.5,0);part(.95,.95,.95,skin,0,2.6,0);
  part(.12,.18,.05,'#1b1936',-.2,2.66,.48);part(.12,.18,.05,'#1b1936',.2,2.66,.48);part(.3,.06,.05,'#1b1936',0,2.4,.48);
  sc.add(av);cam.position.set(0,1.7,9);cam.lookAt(0,1.55,0);
  const fit=()=>{const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();av.position.x=-Math.tan(cam.fov*Math.PI/360)*9*cam.aspect*.5};
  HC={r,fit,raf:0};fit();
  const t0=performance.now();
  const loop=()=>{if(!cv.isConnected){r.dispose();if(HC&&HC.r===r)HC=null;return}
    HC.raf=requestAnimationFrame(loop);
    if(W.run)return;
    const t=(performance.now()-t0)/1000,s=Math.sin(t*3.2)*.55;
    av.rotation.y=Math.sin(t*.8)*.55-.25;av.position.y=Math.abs(Math.sin(t*3.2))*.12;
    lL.rotation.x=s;lR.rotation.x=-s;aL.rotation.x=-s;aR.rotation.x=s;r.render(sc,cam)};
  loop();
}
addEventListener('resize',()=>HC&&HC.fit());
// mouse wheel scrolls the game rows sideways while hovering over them
document.addEventListener('wheel',e=>{const r=e.target.closest&&e.target.closest('.rail');if(!r||e.ctrlKey)return;const mx=r.scrollWidth-r.clientWidth;if(mx<=0)return;
  let d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(e.deltaMode===1)d*=32;
  if((d>0&&r.scrollLeft>=mx-1)||(d<0&&r.scrollLeft<=0))return;e.preventDefault();r.scrollLeft+=d},{passive:false});
go(0);
